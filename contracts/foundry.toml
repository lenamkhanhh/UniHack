[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
dynamic_test_linking = false
no_match_path = "test/invariant/mutants/*"

[invariant]
runs = 512
depth = 64
fail_on_revert = false

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
