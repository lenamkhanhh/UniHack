<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MissionPay Demo - Title Card (v8b)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      background: #F7F6F2;
      color: #0F1115;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Geist Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0F1115;
      margin-bottom: 28px;
    }

    .red-sq {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #E84142;
      flex-shrink: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 84px;
      height: 84px;
      background: #E84142;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 30px -6px rgba(232, 65, 66, 0.4);
    }

    .logo-text {
      font-family: 'Archivo', sans-serif;
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #0F1115;
      text-transform: uppercase;
    }

    .headline {
      font-family: 'Archivo', sans-serif;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      color: #0F1115;
      max-width: 1300px;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .dot-accent {
      color: #E84142;
    }

    .subheadline {
      font-size: 24px;
      color: #5E646E;
      font-weight: 500;
      max-width: 900px;
      margin-bottom: 56px;
      line-height: 1.5;
    }

    .navy-band {
      background: #14213D;
      border-top: 4px solid #E84142;
      border-radius: 14px;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      gap: 36px;
      color: #FFFFFF;
      font-family: 'Geist Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 20px 40px -10px rgba(20, 33, 61, 0.35);
    }

    .navy-band .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0B7A4B;
      display: inline-block;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="kicker">
    <span class="red-sq"></span>UNIHACK 2026 · AVALANCHE TEAM 1 VIETNAM
  </div>

  <div class="logo-container">
    <div class="logo-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <div class="logo-text">MissionPay<span class="dot-accent">.</span></div>
  </div>

  <div class="headline">
    Same vendor. Same treasury. Two outcomes<span class="dot-accent">.</span>
  </div>

  <div class="subheadline">
    Guarded Autonomous Agent Budgets on Avalanche Fuji C-Chain
  </div>

  <div class="navy-band">
    <div><span class="dot"></span>Live on Avalanche Fuji Testnet</div>
    <div style="opacity: 0.4;">|</div>
    <div>GuardedTreasury: <span style="color: #60A5FA;">0x20451c1e2dCD83F166B4f22868BAdECb5868d545</span></div>
    <div style="opacity: 0.4;">|</div>
    <div>Twin Treasury Benchmark (100% On-Chain Proof)</div>
  </div>
</body>
</html>
