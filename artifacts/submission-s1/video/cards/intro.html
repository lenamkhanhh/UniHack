<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MissionPay Demo - Title Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 40%, #161f30 0%, #0B0F17 75%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow elements */
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
    }
    .glow-1 {
      width: 600px;
      height: 600px;
      background: rgba(232, 65, 66, 0.15);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      border-radius: 9999px;
      background: rgba(232, 65, 66, 0.12);
      border: 1px solid rgba(232, 65, 66, 0.4);
      color: #E84142;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      animation: fadeIn 0.8s ease-out;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #E84142 0%, #991B1B 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(232, 65, 66, 0.45);
    }

    .logo-text {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -1.5px;
      background: linear-gradient(180deg, #FFFFFF 30%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .headline {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.25;
      color: #F8FAFC;
      max-width: 1200px;
      margin-bottom: 16px;
    }

    .headline span.accent {
      color: #E84142;
    }

    .subheadline {
      font-size: 26px;
      color: #94A3B8;
      font-weight: 400;
      max-width: 900px;
      margin-bottom: 50px;
      line-height: 1.5;
    }

    .footer-meta {
      position: absolute;
      bottom: 48px;
      display: flex;
      align-items: center;
      gap: 36px;
      color: #64748B;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer-meta div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }
  </style>
</head>
<body>
  <div class="glow-circle glow-1"></div>

  <div class="badge">
    UniHack 2026 · Avalanche Team 1 Vietnam
  </div>

  <div class="logo-container">
    <div class="logo-icon">
      <!-- Shield / Check SVG icon -->
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <div class="logo-text">MissionPay</div>
  </div>

  <div class="headline">
    Same vendor. Same treasury. <span class="accent">Two outcomes.</span>
  </div>

  <div class="subheadline">
    Guarded Autonomous Agent Budgets on Avalanche Fuji C-Chain
  </div>

  <div class="footer-meta">
    <div><span class="dot"></span> Live on Avalanche Fuji Testnet</div>
    <div>•</div>
    <div>GuardedTreasury: 0x20455B27027d7C6a14201Ea026eE999E10fcd545</div>
    <div>•</div>
    <div>Twin Treasury Benchmark (100% On-Chain Proof)</div>
  </div>
</body>
</html>
